[project]
name = "industrial-cap-anomaly-detection"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anomalib==2.6.2", "torch==2.6.0", "torchvision==0.21.0",
    "lightning", "roboflow>=1.2,<2", "python-dotenv", "pycocotools",
    "jupyterlab>=4,<5", "ipykernel", "numpy", "pandas", "pillow",
    "scikit-learn", "scipy", "matplotlib",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
